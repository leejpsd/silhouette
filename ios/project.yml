# XcodeGen spec for the Silhouette iOS app. Regenerate the project with `make project`.
name: Silhouette
options:
  bundleIdPrefix: app.silhouette
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  SilhouetteCore:
    path: SilhouetteCore
targets:
  Silhouette:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Silhouette
    dependencies:
      - package: SilhouetteCore
    settings:
      base:
        PRODUCT_NAME: Silhouette
        PRODUCT_BUNDLE_IDENTIFIER: app.silhouette.benefits
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Silhouette
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        # The sync phase writes a folder into the app bundle, which the script sandbox would block.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Sync shared contract files
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/sync-shared.sh" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Shared"
    scheme: {}
