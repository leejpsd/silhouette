# XcodeGen spec for the Silhouette iOS app. Regenerate the project with `make project`.
name: Silhouette
options:
  bundleIdPrefix: app.silhouette
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  SilhouetteCore:
    path: SilhouetteCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.3
targets:
  Silhouette:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Silhouette
        excludes:
          # Local only and git-ignored; copied into the bundle by a build phase when present.
          - GoogleService-Info.plist
          - "*.entitlements"
          - Info.plist
    dependencies:
      - package: SilhouetteCore
        product: SilhouetteCore
      - package: SilhouetteCore
        product: SilhouetteKit
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseCore
    settings:
      base:
        PRODUCT_NAME: Silhouette
        PRODUCT_BUNDLE_IDENTIFIER: app.silhouette.benefits
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Registers the bundled fonts (UIAppFonts); everything else is generated.
        INFOPLIST_FILE: Silhouette/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Silhouette
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleLocalizations: "en es"
        # Standard HTTPS only (Firebase); no export-compliance question per build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # The sync phase writes a folder into the app bundle, which the script sandbox would block.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          # App Attest for App Check in release builds (needs a signing team with the capability).
          CODE_SIGN_ENTITLEMENTS: Silhouette/Silhouette.Release.entitlements
    postCompileScripts:
      - name: Sync shared contract files
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/sync-shared.sh" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Shared"
      - name: Copy Firebase configuration when present
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/copy-firebase-config.sh" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
    scheme:
      testTargets:
        - SilhouetteTests
        - SilhouetteUITests
  # Tests of the app's code against the Firebase SDK itself (the SDK's hybrid session and the app's
  # step around its cloud side). No model and no network.
  SilhouetteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SilhouetteTests
    dependencies:
      - target: Silhouette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.silhouette.benefits.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Silhouette.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Silhouette"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  SilhouetteUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SilhouetteUITests
    dependencies:
      - target: Silhouette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.silhouette.benefits.uitests
        TEST_TARGET_NAME: Silhouette
        GENERATE_INFOPLIST_FILE: YES
        # Registers the bundled fonts (UIAppFonts); everything else is generated.
        INFOPLIST_FILE: Silhouette/Info.plist
        CODE_SIGN_STYLE: Automatic
