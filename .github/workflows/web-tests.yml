name: web-tests
on:
  push:
    paths: ['web/**', 'shared/**', '.github/workflows/web-tests.yml']
  pull_request:
    paths: ['web/**', 'shared/**', '.github/workflows/web-tests.yml']
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
