name: contracts
on:
  push:
    paths: ['shared/**']
  pull_request:
    paths: ['shared/**']
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: shared/reference
